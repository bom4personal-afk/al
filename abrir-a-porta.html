<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open the door</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #fff;
    }
    .wrapper {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    button {
      width: 80%;
      max-width: 320px;
      padding: 24px;
      font-size: 20px;
      border: none;
      border-radius: 16px;
      background: #22c55e;
      color: #022c22;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button:active {
      transform: scale(0.97);
      background: #16a34a;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h3 id="pt-text">Para abrir a porta do prédio, pressione o botão.</h3>
    <h3 id="en-text">To open the building door, press the button.</h3>
    <button id="btn">Abrir prédio / Open building</button>
  </div>

  <script>
    const WORKER_URL = "https://ewelink-button.wl-image-proxy.workers.dev";
    const SECRET = "banana-coffee-robot";
    const BUTTON = document.getElementById("btn");
    const PT_TEXT = document.getElementById("pt-text");
    const EN_TEXT = document.getElementById("en-text");

    const WAIT_TIME = 20; // секунд після 1-го натискання
    const MAX_CLICKS = 2;
    const BLOCK_TIME = 10 * 60 * 1000; // 10 хвилин блокування після 2-го кліку

    const formatTime = (sec) => `${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}`;

    // --- перевірка блокування при завантаженні ---
    const now = Date.now();
    const blockedUntil = localStorage.getItem("blockedUntil");

    if (blockedUntil && now < blockedUntil) {
      BUTTON.disabled = true;
      PT_TEXT.textContent = "Seja bem-vindo! Para as entradas seguintes, por favor, use a chave física, que está pendurada acima da secretária do seu quarto. Obrigado!";
      EN_TEXT.textContent = "Welcome! For the next entries, please use the physical key, which is hanging above the desk in your room. Thank you!";

      const updateCountdown = () => {
        const msLeft = blockedUntil - Date.now();
        if (msLeft <= 0) {
          location.reload();
        } else {
          const minutes = Math.floor(msLeft / 60000);
          const seconds = Math.floor((msLeft % 60000) / 1000);
          BUTTON.textContent = `Bloqueado / Locked ${minutes}:${seconds.toString().padStart(2,'0')}`;
        }
      };
      updateCountdown();
      setInterval(updateCountdown, 1000);
    }

    BUTTON.onclick = async () => {
      let clicks = Number(localStorage.getItem("clicks") || 0);
      clicks++;
      localStorage.setItem("clicks", clicks);

      // --- повідомлення після першого натискання ---
      if (clicks === 1) {
        PT_TEXT.textContent = "Seja bem-vindo! Para as entradas seguintes, por favor, use a chave física, que está pendurada acima da secretária do seu quarto. Obrigado!";
        EN_TEXT.textContent = "Welcome! For the next entries, please use the physical key, which is hanging above the desk in your room. Thank you!";

        // Таймер 20 секунд після першого натискання
        BUTTON.disabled = true;
        let countdown = WAIT_TIME;
        BUTTON.textContent = `Aguardar / Wait ${formatTime(countdown)}`;

        const timer = setInterval(() => {
          countdown--;
          BUTTON.textContent = `Aguardar / Wait ${formatTime(countdown)}`;
          if (countdown <= 0) {
            clearInterval(timer);
            BUTTON.disabled = false;
            BUTTON.textContent = "Abrir prédio / Open building";
          }
        }, 1000);
      }

      // --- блокування після другого натискання ---
      if (clicks >= MAX_CLICKS) {
        localStorage.setItem("blockedUntil", Date.now() + BLOCK_TIME);
        localStorage.removeItem("clicks");
        BUTTON.disabled = true;
        PT_TEXT.textContent = "Por favor, use a chave, ela está na sala sobre a mesa. Obrigado!";
        EN_TEXT.textContent = "Please use the key, it is hanging in the room above the table. Thank you!";

        const updateCountdown = () => {
          const msLeft = localStorage.getItem("blockedUntil") - Date.now();
          if (msLeft <= 0) {
            location.reload();
          } else {
            const minutes = Math.floor(msLeft / 60000);
            const seconds = Math.floor((msLeft % 60000) / 1000);
            BUTTON.textContent = `Bloqueado / Locked ${minutes}:${seconds.toString().padStart(2,'0')}`;
          }
        };
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }

      // --- надсилаємо запит до воркера ---
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "x-key": SECRET }
        });
        const data = await res.json();
      } catch (e) {
        alert("error: " + e.message);
        BUTTON.disabled = false;
        BUTTON.textContent = "Abrir prédio / Open building";
      }
    };
  </script>
</body>
</html>
