<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shelly Opener</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    button {
      padding: 24px 50px;
      font-size: 22px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(45deg, #FFD700, #FFC107);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(255, 215, 0, 0.4);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }
    button:active {
      transform: scale(0.97);
      box-shadow: 0 2px 4px rgba(255, 215, 0, 0.4);
    }
  </style>
</head>
<body>
  <button id="openBtn">Abrir / Open</button>

  <script>
    const WORKER_URL = "https://shelly-opener.wl-image-proxy.workers.dev";

    document.getElementById("openBtn").onclick = async () => {
      try {
        const res = await fetch(WORKER_URL, { method: "POST" });
        const data = await res.json();
        console.log("Response from worker:", data);
      } catch (err) {
        console.error("Error calling worker:", err);
      }
    };
  </script>
</body>
</html>
