<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shelly Opener</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    button {
      padding: 24px 40px;
      font-size: 20px;
      border: none;
      border-radius: 16px;
      background: #22c55e;
      color: #022c22;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button:active {
      transform: scale(0.97);
      background: #16a34a;
    }
  </style>
</head>
<body>
  <button id="openBtn">Abrir / Open</button>

  <script>
    const WORKER_URL = "https://shelly-opener.wl-image-proxy.workers.dev";

    document.getElementById("openBtn").onclick = async () => {
      const btn = document.getElementById("openBtn");
      btn.disabled = true;
      let countdown = 15;
      const originalText = btn.textContent;

      // Текст і таймер
      const timer = setInterval(() => {
        btn.textContent = `Aguardar / Wait ${countdown}s`;
        countdown--;
        if (countdown < 0) {
          clearInterval(timer);
          btn.textContent = originalText;
          btn.disabled = false;
        }
      }, 1000);

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST"
        });

        const data = await res.json();
        console.log("Response:", data);
      } catch (err) {
        console.error("Error:", err);
      }
    };
  </script>
</body>
</html>
