<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Заборона кешування -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Abrir SMS / Open SMS</title>

  <script>
    // ===============================
    // Задаємо номер і текст SMS один раз
    // ===============================
    const phoneNumber = '+351925746023';  // <-- тут змінюєш номер
    const smsBody = 'SN3618OTGCTEST';     // <-- тут змінюєш текст

    // Унікальний параметр для обходу кешу
    const uniqueParam = Date.now();

    // Генеруємо URL для SMS з унікальним параметром
    const smsUrl = `sms:${phoneNumber}?body=${encodeURIComponent(smsBody)}&v=${uniqueParam}`;

    // Автоматичне перенаправлення
    window.location.replace(smsUrl);
  </script>
</head>
<body>
  <p>
    Abrindo SMS… Se nada acontecer, <br>
    Opening SMS… If nothing happens, <br>
    <a id="smslink" href="#" onclick="
      const url = `sms:${phoneNumber}?body=${encodeURIComponent(smsBody)}&v=${Date.now()}`;
      window.location.replace(url);
      return false;
    ">Clique aqui / Click here</a>.
  </p>
</body>
</html>
