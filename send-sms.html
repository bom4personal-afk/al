<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Abrir SMS / Open SMS</title>

  <script>
    const phoneNumber = '+351925746023';
    const smsBody = 'SN3618OTGC';
    const uniqueParam = Date.now();
    const smsUrl = `sms:${phoneNumber}?body=${encodeURIComponent(smsBody)}&v=${uniqueParam}`;
    window.location.replace(smsUrl);
  </script>
</head>
<body>
  <p>
    Abrindo SMS… Se nada acontecer, <br>
    Opening SMS… If nothing happens, <br>
    <a id="smslink" href="#" onclick="
      const phone = '+351925746023';
      const body = 'SN3618OTGC';
      const url = `sms:${phone}?body=${encodeURIComponent(body)}&v=${Date.now()}`;
      window.location.replace(url);
      return false;
    ">Clique aqui / Click here</a>.
  </p>
</body>
</html>
