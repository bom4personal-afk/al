<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Запобігаємо кешуванню (працює для нових URL) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Abrir SMS / Open SMS</title>

  <script>
    // Задаєш тут номер та текст (єдине місце для редагування)
    const phoneNumber = '+351925746023';
    const smsBody = 'SN3618OTGC';

    // Унікальний параметр для SMS, щоб не брати кеш навіть всередині браузера
    const smsUrl = `sms:${phoneNumber}?body=${encodeURIComponent(smsBody)}&v=${Date.now()}`;

    // Автоматичне відкриття SMS
    window.onload = function () {
      window.location.href = smsUrl;
    };
  </script>
</head>
<body>
  <p>
    Abrindo SMS… Se nada acontecer, <br>
    Opening SMS… If nothing happens, <br>
    <a href="#" onclick="
      const url = `sms:${phoneNumber}?body=${encodeURIComponent(smsBody)}&v=${Date.now()}`;
      window.location.href = url;
      return false;
    ">Clique aqui / Click here</a>.
  </p>
</body>
</html>
